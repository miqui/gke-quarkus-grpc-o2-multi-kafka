# The API's identity. Workload Identity binds it to the job-manager-api GSA (gke-deploy.sh), which
# holds roles/managedkafka.client: the Kafka producer authenticates as that GSA (SASL/OAUTHBEARER,
# tokens from the GKE metadata server). Nothing calls the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-manager-api
  labels:
    app: job-manager-api
  annotations:
    iam.gke.io/gcp-service-account: job-manager-api@k8s-dev-412419.iam.gserviceaccount.com
automountServiceAccountToken: false
