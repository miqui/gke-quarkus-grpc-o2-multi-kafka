apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-manager-api
  labels:
    app: job-manager-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: job-manager-api
  template:
    metadata:
      labels:
        app: job-manager-api
    spec:
      terminationGracePeriodSeconds: 45
      # Bound to the job-manager-api GSA by Workload Identity (k8s/serviceaccount.yaml): the
      # identity the Kafka producer authenticates as.
      serviceAccountName: job-manager-api
      securityContext:
        # runAsUser is set explicitly as well as runAsNonRoot: 10001 is the image's numeric `app`
        # uid/gid (see the Dockerfile), which is what lets the kubelet verify it's non-root. It is
        # above 10000 so it can't collide with a host user (Trivy KSV-0020/KSV-0021).
        # The container-level securityContexts below (no privilege escalation, no capabilities)
        # are what the Kyverno policies in k8s/policies/ require; readOnlyRootFilesystem is for
        # Trivy KSV-0014.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          envFrom:
            - configMapRef:
                name: job-manager-api-config
            - secretRef:
                name: postgres-credentials
          env:
            # Cloud SQL private IP, from the Secret Crossplane writes for the PostgresInstance
            # (k8s/postgres.yaml). Until that exists the pod shows CreateContainerConfigError
            # and the kubelet keeps retrying.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-connection
                  key: privateIP
          command:
            - sh
            - -c
            - |
              # Connect to the application database itself, not just the server: Cloud SQL accepts
              # connections (pg_isready passes) minutes before Crossplane has created the database
              # and user, and Flyway would crash on "database does not exist" at startup.
              export PGPASSWORD="$DB_PASSWORD" PGSSLMODE="$DB_SSLMODE" PGCONNECT_TIMEOUT=3
              until psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc 'SELECT 1' >/dev/null 2>&1; do
                echo "Waiting for database $DB_NAME on Cloud SQL at $DB_HOST:$DB_PORT..."
                sleep 2
              done
        - name: wait-for-hazelcast
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          envFrom:
            - configMapRef:
                name: job-manager-api-config
          command:
            - sh
            - -c
            - |
              until nc -z "$HAZELCAST_HOST" "$HAZELCAST_PORT"; do
                echo "Waiting for hazelcast at $HAZELCAST_HOST:$HAZELCAST_PORT..."
                sleep 2
              done
      containers:
        - name: job-manager-api
          image: job-manager-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The root filesystem is read-only; /tmp (java.io.tmpdir, see the Dockerfile) is the one
          # writable path - Netty unpacks its native transport there and Vert.x its file cache.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 9090
              name: grpc
            - containerPort: 8081
              name: mgmt
          envFrom:
            - configMapRef:
                name: job-manager-api-config
            - secretRef:
                name: postgres-credentials
          env:
            # Cloud SQL private IP, see the wait-for-postgres init container.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-connection
                  key: privateIP
            # Managed Kafka bootstrap address, from the Secret Crossplane writes for the
            # KafkaCluster (k8s/kafka.yaml). Until that exists (first provisioning takes ~30
            # minutes) the pod shows CreateContainerConfigError and the kubelet keeps retrying.
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: kafka-connection
                  key: bootstrap_address
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # JVM sizing: the heap is 75% of the limit (MaxRAMPercentage in the Dockerfile); the
          # remaining ~190Mi covers metaspace, thread stacks and Netty's direct buffers. (Quarkus
          # needs less than the Spring Boot service did; kept as-is until load tests say otherwise.)
          # Requests == limits for memory so the pod is never OOM-killed for using what it was
          # promised.
          # The CPU limit is generous because JIT compilation at startup is CPU-bound.
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "768Mi"
          # Probes hit SmallRye Health on the Quarkus management interface (plain HTTP/1.1), not
          # gRPC. Startup budget: 5s + 24 x 5s = 125s, for a cold JVM plus Flyway plus the
          # Hazelcast connect timeout (20s) on a throttled node.
          startupProbe:
            httpGet:
              path: /q/health/live
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: mgmt
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: mgmt
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # Shutdown: the pod leaves the Service endpoints as soon as it is Terminating, but the
          # load balancer takes a few seconds to notice. The sleep keeps serving during that window;
          # then SIGTERM flips readiness DOWN for quarkus.shutdown.delay (5s) and in-flight calls
          # get quarkus.shutdown.timeout (20s) to finish. 10 + 5 + 20 < 45.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      # Spread replicas: hostname spread handles single-node loss; zone spread puts the 3 replicas
      # in us-central1-a/b/c (the node pool spans all three, gke-deploy.sh NODE_ZONES), so losing
      # a zone leaves two serving while the third is rescheduled. ScheduleAnyway, not
      # DoNotSchedule: during a zone outage the dead zone's NotReady nodes still count as a
      # domain, and a hard constraint would block the replacement pod from the surviving zones.
      # The PodDisruptionBudget (k8s/pdb.yaml) covers voluntary disruptions. This replaces the
      # previous preferred podAntiAffinity, which the spread constraint subsumes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: job-manager-api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: job-manager-api
