// job-manager-api gRPC contract, v1. One resource, Job, addressed by UUID string, plus its audit
// trail (JobEvent) and the registry of job types it accepts (JobType).
//
// The API manages jobs; it does not run them. Clients submit and observe jobs (JobService);
// external workers lease them, report progress and finish them (WorkerService):
//
//   CreateJob -> QUEUED --ClaimJob--> RUNNING --CompleteJob--> SUCCEEDED
//                  ^                     |  \---FailJob (final)---> FAILED
//                  |                     |
//                  +--FailJob(retryable)-+  (attempts left; re-runs after a backoff)
//                  +--lease expired------+  (attempts left; otherwise FAILED)
//   CancelJob: QUEUED or RUNNING -> CANCELLED. SUCCEEDED, FAILED, CANCELLED are terminal.
//
// Errors are google.rpc.Status (grpc-status-details-bin trailer) carrying:
//   - google.rpc.ErrorInfo  reason = BAD_USER_INPUT | NOT_FOUND | CONFLICT | LEASE_NOT_HELD |
//                           INTERNAL_SERVER_ERROR, domain = "job-manager-api.miqui.dev" - the
//                           stable code to switch on
//   - google.rpc.BadRequest one FieldViolation per invalid field (INVALID_ARGUMENT only)
// See API-DESIGN.md for the status code of every outcome.
// All text fields, and every key and string inside spec/result/details, reject U+0000 (NUL).
syntax = "proto3";

package job.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
// Not referenced by any field: imported so server reflection also serves ErrorInfo and
// BadRequest, letting grpcurl decode the error details instead of printing raw bytes.
import "google/rpc/error_details.proto";

option java_multiple_files = true;
option java_package = "dev.miqui.jobmanager.v1";
option java_outer_classname = "JobServiceProto";

// ---- resources ---------------------------------------------------------------------------------

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
  JOB_STATE_CANCELLED = 5;
}

message Job {
  string id = 1;
  // Free-form display name.
  string name = 2;
  // A registered JobType name (ListJobTypes); workers claim by type.
  string type = 3;
  JobState state = 4;
  // 0-9, higher is claimed first.
  int32 priority = 5;
  // The job's input, any JSON object (stored as JSONB).
  google.protobuf.Struct spec = 6;
  map<string, string> labels = 7;
  // Set by CompleteJob.
  google.protobuf.Struct result = 8;
  // The most recent failure (FailJob or an expired lease); kept after a retry succeeds.
  JobError error = 9;
  // How many times the job has been claimed.
  int32 attempts = 10;
  int32 max_attempts = 11;
  // Not claimable before this time (creation time, a requested delay, or a retry backoff).
  google.protobuf.Timestamp run_after = 12;
  // The worker holding the job and until when; only set while RUNNING.
  string lease_owner = 13;
  google.protobuf.Timestamp lease_expires_at = 14;
  // Optimistic-locking version: starts at 0, +1 on every state change (not on heartbeats).
  int32 version = 15;
  string idempotency_key = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  // First claim, and entry into a terminal state.
  google.protobuf.Timestamp started_at = 19;
  google.protobuf.Timestamp finished_at = 20;
}

message JobError {
  string message = 1;
  google.protobuf.Struct details = 2;
  bool retryable = 3;
}

// One state change, oldest first. from_state is UNSPECIFIED for the creation event.
message JobEvent {
  int64 id = 1;
  string job_id = 2;
  JobState from_state = 3;
  JobState to_state = 4;
  // "api", "worker:<worker_id>" or "system:lease-reaper".
  string actor = 5;
  google.protobuf.Struct detail = 6;
  google.protobuf.Timestamp at = 7;
}

// Registered with SQL (see DB.md); read through a per-pod cache.
message JobType {
  string name = 1;
  string description = 2;
  // Used when CreateJob leaves max_attempts unset.
  int32 default_max_attempts = 3;
  // Used when ClaimJob leaves lease_seconds unset.
  int32 default_lease_seconds = 4;
}

// ---- clients -----------------------------------------------------------------------------------

service JobService {
  // INVALID_ARGUMENT (also for an unregistered type). With an idempotency_key that was already
  // used, returns the job created by the first call instead of creating another.
  rpc CreateJob(CreateJobRequest) returns (Job);
  // Terminal jobs are served from the cache (cache-aside). INVALID_ARGUMENT, NOT_FOUND.
  rpc GetJob(GetJobRequest) returns (Job);
  // Newest first, optionally filtered. INVALID_ARGUMENT.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // QUEUED or RUNNING -> CANCELLED. INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION (already
  // terminal), ABORTED (version given and the job changed since: refetch and retry).
  rpc CancelJob(CancelJobRequest) returns (Job);
  // Terminal jobs only, with their events. INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION.
  rpc DeleteJob(DeleteJobRequest) returns (google.protobuf.Empty);
  // A job's state changes, oldest first. INVALID_ARGUMENT, NOT_FOUND.
  rpc ListJobEvents(ListJobEventsRequest) returns (ListJobEventsResponse);
  rpc ListJobTypes(ListJobTypesRequest) returns (ListJobTypesResponse);
}

message CreateJobRequest {
  // Trimmed, non-blank, at most 100 characters.
  string name = 1;
  // A registered type name.
  string type = 2;
  // Required; at most 32 KiB as compact JSON.
  google.protobuf.Struct spec = 3;
  // At most 16. Keys: 1-63 chars of [a-z0-9._/-], starting and ending alphanumeric.
  // Values: at most 63 characters.
  map<string, string> labels = 4;
  // 0-9, default 0.
  optional int32 priority = 5;
  // 1-20, default the type's default_max_attempts.
  optional int32 max_attempts = 6;
  // Absent means now; at most 30 days ahead.
  google.protobuf.Timestamp run_after = 7;
  // Optional, at most 100 characters.
  string idempotency_key = 8;
}

message GetJobRequest {
  string id = 1;
}

message ListJobsRequest {
  // 1-200, default 50 when absent.
  optional int32 limit = 1;
  // 0 or more, default 0.
  optional int32 offset = 2;
  // Any of these states; empty means all.
  repeated JobState states = 3;
  // Exact type; empty means all.
  string type = 4;
  // Jobs carrying every one of these labels.
  map<string, string> labels = 5;
}

message ListJobsResponse {
  repeated Job items = 1;
  int64 total_count = 2;
}

message CancelJobRequest {
  string id = 1;
  // When present, cancel only if the job is still at this version.
  optional int32 version = 2;
  // Optional, at most 500 characters; recorded on the event.
  string reason = 3;
}

message DeleteJobRequest {
  string id = 1;
}

message ListJobEventsRequest {
  string job_id = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
}

message ListJobEventsResponse {
  repeated JobEvent items = 1;
  int64 total_count = 2;
}

message ListJobTypesRequest {
}

message ListJobTypesResponse {
  repeated JobType items = 1;
}

// ---- workers -----------------------------------------------------------------------------------

service WorkerService {
  // Leases the next claimable job (highest priority, then oldest run_after) among `types`, or
  // returns an empty response when none is ready. Concurrent claims never get the same job.
  // INVALID_ARGUMENT.
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  // Extends the lease. INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION/LEASE_NOT_HELD (the job
  // was cancelled, re-queued after the lease expired, or is held by another worker: stop work).
  rpc Heartbeat(HeartbeatRequest) returns (Job);
  // RUNNING -> SUCCEEDED. INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION/LEASE_NOT_HELD.
  rpc CompleteJob(CompleteJobRequest) returns (Job);
  // RUNNING -> QUEUED (retryable with attempts left, after an exponential backoff) or FAILED.
  // INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION/LEASE_NOT_HELD.
  rpc FailJob(FailJobRequest) returns (Job);
}

message ClaimJobRequest {
  // Identifies the worker: 1-100 chars of [A-Za-z0-9._:-].
  string worker_id = 1;
  // At least one, at most 20 registered type names.
  repeated string types = 2;
  // 5-3600, default the type's default_lease_seconds.
  optional int32 lease_seconds = 3;
}

message ClaimJobResponse {
  // Absent when no job was claimable.
  Job job = 1;
}

message HeartbeatRequest {
  string job_id = 1;
  string worker_id = 2;
  // 5-3600, default the type's default_lease_seconds. Counted from now.
  optional int32 lease_seconds = 3;
}

message CompleteJobRequest {
  string job_id = 1;
  string worker_id = 2;
  // Optional; at most 32 KiB as compact JSON.
  google.protobuf.Struct result = 3;
}

message FailJobRequest {
  string job_id = 1;
  string worker_id = 2;
  // Trimmed, non-blank, at most 1000 characters.
  string message = 3;
  // Optional; at most 32 KiB as compact JSON.
  google.protobuf.Struct details = 4;
  // Re-queue if attempts remain.
  bool retryable = 5;
}
