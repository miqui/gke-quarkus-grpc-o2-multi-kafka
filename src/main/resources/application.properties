# Runtime configuration. Environment variable names match k8s/configmap.yaml and the
# postgres-credentials Secret (both injected with envFrom); the defaults suit a local run against
# `docker compose up` (compose.yaml). Test overrides are the %test. entries at the bottom.
quarkus.application.name=job-manager-api
quarkus.banner.enabled=false

# ---- gRPC (:9090, cleartext HTTP/2 - TLS ends at the load balancer) -------------------------------
# A separate Netty server, as before, so the Service, Gateway and HTTPRoute don't change.
quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=${GRPC_PORT:9090}
quarkus.grpc.server.test-port=9091
# Bounds the cost of one request: spec/result are capped at 32 KiB each, the rest is small.
quarkus.grpc.server.max-inbound-message-size=65536
# Reflection (grpcurl without the .proto) and grpc.health.v1; both public, like the whole API.
quarkus.grpc.server.enable-reflection-service=true
# error_details.proto (ErrorInfo, BadRequest) is imported by job_service.proto for reflection.
quarkus.generate-code.grpc.scan-for-imports=all

# ---- management interface (:8081): kubelet probes and the LB health check only -----------------
quarkus.management.enabled=true
quarkus.management.host=0.0.0.0
quarkus.management.port=${MANAGEMENT_PORT:8081}
quarkus.management.test-port=9082
# Nothing is served on the main HTTP port.
quarkus.http.host-enabled=false
# Readiness reflects only whether this pod accepts traffic (as with Spring's readinessState): a
# Cloud SQL blip should not take every pod out of the load balancer at once.
quarkus.datasource.health.enabled=false
quarkus.smallrye-health.ui.enabled=false

# ---- shutdown --------------------------------------------------------------------------------------
# SIGTERM: readiness goes DOWN for the delay (the LB notices and stops sending), then in-flight
# calls get the timeout to finish. preStop sleep 10s + 5s + 20s < terminationGracePeriodSeconds 45.
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=5s
quarkus.shutdown.timeout=20s

# ---- database ----------------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# %prod only: in dev mode and tests, Dev Services start a Postgres container instead.
# Cloud SQL is ENCRYPTED_ONLY: the ConfigMap sets DB_SSLMODE=require.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:messagedb}?sslmode=${DB_SSLMODE:prefer}
%prod.quarkus.datasource.username=${DB_USER:message_app}
%prod.quarkus.datasource.password=${DB_PASSWORD:message_app}
# 6 pods x 10 stays well under Cloud SQL's max_connections=100.
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:10}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.acquisition-timeout=5S
# No JTA: transactions are explicit (repo/Db.java).
quarkus.datasource.jdbc.transactions=disabled
# agroal_* pool metrics, and one JDBC span per statement under the gRPC span.
quarkus.datasource.metrics.enabled=true
quarkus.datasource.jdbc.telemetry=true

# Runs at startup on every replica; Flyway serialises them with a Postgres advisory lock.
# baseline-on-migrate + version 1 adopts a database created by the Python service's Alembic
# revision 0001 (identical to V1).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# ---- cache -------------------------------------------------------------------------------------
# Build-time switch: hazelcast (default) or memory (tests).
app.cache.type=hazelcast
app.hazelcast.host=${HAZELCAST_HOST:localhost}
app.hazelcast.port=${HAZELCAST_PORT:5701}
app.hazelcast.connect-timeout=20s
# Terminal jobs never change again; the TTL only bounds the member's memory.
app.hazelcast.ttl=1h
quarkus.cache.caffeine."job-types".expire-after-write=60s

# ---- jobs --------------------------------------------------------------------------------------
# How often RUNNING jobs whose lease has passed are re-queued (or failed, with no attempts left).
app.jobs.reaper-interval=5s
# How often the jobs-by-state gauges are refreshed from the database.
app.jobs.stats-interval=15s

# ---- logging -----------------------------------------------------------------------------------
# One JSON object per line (with traceId/spanId in mdc while a span is active); the log collector
# ships stdout to OpenObserve's pod_logs stream. LOG_FORMAT_JSON=false for readable local logs.
quarkus.log.console.json.enabled=${LOG_FORMAT_JSON:true}
quarkus.log.category."com.hazelcast".level=WARN

# ---- telemetry (OTLP/HTTP push to the OTel Collector) ------------------------------------------
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.timeout=5s
quarkus.otel.resource.attributes=k8s.pod.name=${POD_NAME:local}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:false}
quarkus.otel.metrics.enabled=true
quarkus.otel.metric.export.interval=15s
# Logs stay on stdout (the log collector), not OTLP.
quarkus.otel.logs.enabled=false
# Parent-based: new traces sampled at this ratio, children follow their parent's decision.
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${TRACES_SAMPLING_PROBABILITY:0.1}

# Micrometer (bridged to OTel): JVM/system binders on, request binders off - the gRPC timer and
# error counter come from grpc/RpcMetricsInterceptor with the labels the dashboards use, and HTTP
# only serves probes.
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.grpc-server.enabled=false
quarkus.micrometer.binder.grpc-client.enabled=false
quarkus.micrometer.binder.http-server.enabled=false
quarkus.micrometer.binder.http-client.enabled=false
quarkus.micrometer.binder.vertx.enabled=false
quarkus.micrometer.binder.netty.enabled=false

# ---- tests -------------------------------------------------------------------------------------
# Dev Services start postgres:16-alpine (same major as Cloud SQL) with Testcontainers.
quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.app.cache.type=memory
%test.app.jobs.reaper-interval=off
%test.app.jobs.stats-interval=off
%test.quarkus.otel.exporter.otlp.endpoint=http://localhost:1
%test.quarkus.otel.metrics.exporter=none
%test.quarkus.otel.traces.exporter=none
%test.quarkus.log.console.json.enabled=false
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
